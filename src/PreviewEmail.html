<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; font-size: 13px; margin: 12px; }
      .row { display: flex; gap: 10px; align-items: end; margin-bottom: 10px; }
      .row label { display: block; margin-bottom: 2px; color: #555; }
      select { min-width: 200px; }
      #subject { margin: 8px 0; }
      iframe { width: 100%; height: 440px; border: 1px solid #ccc; background: white; }
      .error { color: #b00020; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="row">
      <div>
        <label for="template-select">Modèle</label>
        <select id="template-select">
          <? for (const name of templates) { ?>
            <option value="<?= name ?>"><?= name ?></option>
          <? } ?>
        </select>
      </div>
      <div>
        <label for="person-select">Destinataire</label>
        <select id="person-select">
          <? for (const c of cas) { ?>
            <option value="<?= c.key ?>"><?= c.label ?></option>
          <? } ?>
          <? for (const p of personnes) { ?>
            <option value="<?= p.key ?>"><?= p.label ?></option>
          <? } ?>
        </select>
      </div>
      <div>
        <button id="show" onclick="render();">Afficher</button>
      </div>
    </div>
    <div id="subject"></div>
    <iframe id="preview" sandbox=""></iframe>
    <div id="error" class="error"></div>

    <script>
      function render() {
        var template = document.getElementById('template-select').value;
        var key = document.getElementById('person-select').value;
        document.getElementById('error').textContent = '';
        document.getElementById('show').disabled = true;
        google.script.run
          .withSuccessHandler(function (mail) {
            document.getElementById('show').disabled = false;
            document.getElementById('subject').innerHTML = '<b>Sujet :</b> ';
            document.getElementById('subject').appendChild(document.createTextNode(mail.subject));
            document.getElementById('preview').srcdoc = mail.html;
          })
          .withFailureHandler(function (error) {
            document.getElementById('show').disabled = false;
            document.getElementById('error').textContent = 'Erreur : ' + error.message;
          })
          .renderEmail(template, key);
      }
      render();
    </script>
  </body>
</html>
