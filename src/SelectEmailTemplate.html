<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; font-size: 13px; margin: 12px; }
      select { width: 100%; margin: 4px 0 12px; }
      ul { margin: 4px 0 12px; padding-left: 20px; color: #555; }
      .big { font-size: 15px; }
      .warning { color: #8a6d00; }
      .error { color: #b00020; margin-top: 8px; }
      button { margin-right: 6px; }
    </style>
  </head>
  <body>
    <p class="big"><b><?= summary.aEnvoyer ?></b> courriel<?= summary.aEnvoyer > 1 ? 's' : '' ?> à envoyer.</p>

    <? const ignores = [
         [summary.sansEmail, 'sans adresse email'],
         [summary.homonymes, 'homonymes'],
         [summary.nomIncomplet, 'au nom incomplet'],
         [summary.sansEngagement, 'sans engagement']
       ].filter(function (x) { return x[0] > 0; }); ?>
    <? if (ignores.length) { ?>
      <p>Ne recevront rien (voir <i>Vérifier le classeur</i>) :</p>
      <ul>
        <? for (const x of ignores) { ?>
          <li><?= x[0] ?> personne<?= x[0] > 1 ? 's' : '' ?> <?= x[1] ?></li>
        <? } ?>
      </ul>
    <? } ?>

    <p>Quota d'envoi restant aujourd'hui : <?= summary.quota ?>.
      <? if (summary.aEnvoyer > summary.quota) { ?>
        <br><span class="warning">Seuls les <?= summary.quota ?> premiers (dans l'ordre de la feuille) partiront ; les autres garderont le statut « à envoyer ».</span>
      <? } ?>
    </p>

    <label for="template-select">Modèle de courriel :</label>
    <select id="template-select">
      <? if (summary.templates.length > 1) { ?>
        <option value="">- Choisir un modèle -</option>
      <? } ?>
      <? for (const name of summary.templates) { ?>
        <option value="<?= name ?>"><?= name ?></option>
      <? } ?>
    </select>

    <div>
      <button id="send" onclick="doSendEmails();" <?= summary.aEnvoyer === 0 || summary.quota === 0 ? 'disabled' : '' ?>>Envoyer</button>
      <button onclick="google.script.host.close();">Annuler</button>
    </div>
    <div id="error" class="error"></div>

    <script>
      // A button rather than onchange on the select: keyboard navigation in
      // a select fires change, which used to start the whole send.
      function doSendEmails() {
        var name = document.getElementById('template-select').value;
        if (!name) {
          document.getElementById('error').textContent = 'Choisissez un modèle.';
          return;
        }
        document.getElementById('send').disabled = true;
        google.script.run
          .withSuccessHandler(function () { google.script.host.close(); })
          .withFailureHandler(function (error) {
            document.getElementById('send').disabled = false;
            document.getElementById('error').textContent = 'Erreur : ' + error.message;
          })
          .sendEmails(name);
      }
    </script>
  </body>
</html>
