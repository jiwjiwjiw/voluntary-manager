<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; font-size: 13px; margin: 12px; }
      h2 { font-size: 14px; margin: 14px 0 6px; }
      h2.error { color: #b00020; }
      h2.warning { color: #8a6d00; }
      table { border-collapse: collapse; width: 100%; }
      td { padding: 3px 6px; vertical-align: top; border-bottom: 1px solid #eee; }
      td.where { white-space: nowrap; color: #555; }
      p.ok { color: #1b7f3b; font-weight: bold; }
    </style>
  </head>
  <body>
    <? if (!erreurs.length && !avertissements.length) { ?>
      <p class="ok">Aucun problème détecté.</p>
    <? } ?>

    <? if (erreurs.length) { ?>
      <h2 class="error"><?= erreurs.length ?> erreur<?= erreurs.length > 1 ? 's' : '' ?></h2>
      <p>À corriger avant l'envoi : ces lignes seraient ignorées ou faussées.</p>
      <table>
        <? for (const i of erreurs) { ?>
          <tr>
            <td class="where"><?= i.feuille ?><?= i.ligne ? ' · ligne ' + i.ligne : '' ?></td>
            <td><?= i.message ?></td>
          </tr>
        <? } ?>
      </table>
    <? } ?>

    <? if (avertissements.length) { ?>
      <h2 class="warning"><?= avertissements.length ?> avertissement<?= avertissements.length > 1 ? 's' : '' ?></h2>
      <table>
        <? for (const i of avertissements) { ?>
          <tr>
            <td class="where"><?= i.feuille ?><?= i.ligne ? ' · ligne ' + i.ligne : '' ?></td>
            <td><?= i.message ?></td>
          </tr>
        <? } ?>
      </table>
    <? } ?>
  </body>
</html>
